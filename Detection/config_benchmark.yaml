  # Logging settings
  logging:
    level: "WARNING"  # Reduced logging for cleaner output
    disable_http_logs: true

# Security settings
security:
  enable_mcp_only_mode: true
  block_network_tools: true
  workspace_isolation: true
  max_file_size_mb: 100
  disable_safety_mechanisms: true  # For benchmark testing - disables Claude's built-in safety refusals
  allowed_file_extensions:
    - .txt
    - .md
    - .json
    - .yaml
    - .yml
    - .log
