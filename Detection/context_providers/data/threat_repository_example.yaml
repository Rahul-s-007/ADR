threat_framework:
  tactics:
    initial_compromise:
      description: "Adversaries use these techniques to gain initial control and execute malicious actions within your agentic environment"
      techniques:
        - id: "ADR.T0001"
          name: "Insecure Supply Chain for Agentic Components"
          description: "An adversary compromises the agentic system by exploiting a vulnerability in one of its third-party dependencies. This can include compromised open-source libraries used to build MCP servers, tainted base container images, or even fine-tuned models that have been backdoored."
          detection_guidance: []
        - id: "ADR.T0002"
          name: "Indirect Prompt Injection"
          description: "Adversaries inject malicious instructions into external or internal data sources that an agent is expected to process. When the agent retrieves this 'poisoned' data, the instructions are passed into the LLM's context window, causing it to execute unintended commands, bypass its safety protocols, or exfiltrate data."
          detection_guidance: []

        - id: "ADR.T0003"
          name: "Agentic Control-Flow Hijacking"
          description: "An adversary manipulates an agent to chain together individually benign tools to create an emergent, malicious workflow. Since each tool call in isolation may appear legitimate, traditional, stateless security measures may fail to detect the attack. The risk arises from the sequence and combination of actions."
          detection_guidance: []

        - id: "ADR.T0004"
          name: "Abuse of Agent's Code Interpreter"
          description: "An adversary manipulates an agent's native code execution tool (like a sandboxed Python interpreter) to run malicious code. Through clever prompt injection, an adversary can trick the agent into writing and executing code that performs actions beyond its intended scope, such as network reconnaissance, data exfiltration, or attempts to escape its sandbox."
          detection_guidance: []

        - id: "ADR.T0005"
          name: "Insecure Output Handling"
          description: "An adversary tricks an agent into generating malicious output (e.g., XSS, phishing text) that harms a downstream system. The enterprise application fails to properly validate, sanitize, or encode the output generated by the LLM before displaying it or passing it to another system."
          detection_guidance: []

        - id: "ADR.T0006"
          name: "Tool Rug Pull"
          description: "An adversary gets a benign version of a tool approved by security review and deployed to an MCP server. Later, they use a less-secure update mechanism to change the tool's definition or underlying code, inserting a malicious payload. The agent, trusting the already-approved tool, later invokes it and unknowingly executes the malicious code."
          detection_guidance: []

    permission_abuse:
      description: "Adversaries use these techniques to exploit or exceed authorized permissions to access data and resources"
      techniques:
        - id: "ADR.T0007"
          name: "Exploitation of Excessive Tool Permissions"
          description: "A tool available to an agent via an MCP server is configured with more permissions to backend resources than it needs. An adversary can then instruct the agent to use this tool in an unintended way to abuse its excessive permissions, leading to data breaches or unauthorized modifications."
          detection_guidance: []

        - id: "ADR.T0008"
          name: "Agent Identity Spoofing"
          description: "An adversary forges or steals an agent's credentials to impersonate it, thereby inheriting the trusted agent's permissions. This allows the adversary to access tools and data they would not normally be authorized to use, targeting the agent's core identity rather than a specific tool's permissions."
          detection_guidance: []

    security_control_bypass:
      description: "Adversaries use these techniques to evade detection and circumvent security mechanisms"
      techniques:
        - id: "ADR.T0009"
          name: "Tool Shadowing"
          description: "In an environment with multiple, federated MCP servers, an adversary deploys a malicious server that defines a tool with the same name as a trusted, legitimate tool on another server. When an agent queries for a tool by name, it may resolve to the malicious version, causing it to execute unintended and harmful actions."
          detection_guidance: []

        - id: "ADR.T0010"
          name: "Tool Hallucination Manipulation"
          description: "An adversary uses prompt injection techniques to convince an agent that a fake, non-existent tool is real and available for use. The goal is often not to execute the fake tool, but to exploit the agent's error-handling procedures, gather information from the resulting error messages, or trigger insecure fallback mechanisms."
          detection_guidance: []

        - id: "ADR.T0011"
          name: "Malicious Agent Collusion"
          description: "Two or more agents, which may appear benign individually, coordinate to achieve a malicious objective that would be impossible for a single agent to perform due to security controls. This could involve one agent retrieving data and passing it to a second agent that has different permissions (e.g., network access) to exfiltrate it."
          detection_guidance: []

    reasoning_data_manipulation:
      description: "Adversaries use these techniques to corrupt data sources or manipulate an agent's reasoning processes to compromise decision integrity"
      techniques:
        - id: "ADR.T0012"
          name: "Unvetted MCP Server Connection"
          description: "An agent connects to a malicious MCP server, either added by a user or discovered through an untrusted mechanism, which then manipulates the agent's behavior."
          detection_guidance: []

        - id: "ADR.T0013"
          name: "Semantic Data Poisoning"
          description: "An adversary subtly corrupts the data sources used by an agent to make it consistently produce flawed, biased, or incorrect decisions, without hijacking control. Unlike prompt injection, the goal is not to execute a command but to degrade the quality and reliability of the agent's reasoning over time."
          detection_guidance: []

        - id: "ADR.T0014"
          name: "Long-Term Goal Hijacking"
          description: "An adversary engages in a series of subtle interactions designed to slowly corrupt an agent's long-term memory or fine-tuned alignment. This attack is distinct from a one-shot prompt injection, as it aims to fundamentally alter the agent's core objectives, personality, or decision-making policies over time, making it a persistent threat."
          detection_guidance: []

        - id: "ADR.T0015"
          name: "Temporal Data Attack"
          description: "An adversary attacks the integrity of an agent's decisions by manipulating the timing or sequence of data it receives from tools, without altering the content. For agents in real-time environments, stale or out-of-sequence data can be as damaging as false data."
          detection_guidance: []

    operational_impact:
      description: "Adversaries use these techniques to disrupt availability and degrade business operations"
      techniques:
        - id: "ADR.T0016"
          name: "Agent-Facilitated Resource Exhaustion"
          description: "An adversary uses an agent as a vehicle to cause a denial-of-service attack on internal enterprise systems. By instructing the agent to perform repetitive, computationally expensive, or high-volume actions, the adversary can overwhelm backend services, leading to service degradation and financial costs."
          detection_guidance: []

        - id: "ADR.T0017"
          name: "Model-Layer Denial of Service"
          description: "An adversary crafts prompts that are computationally expensive for the specific architecture of the LLM, causing it to consume a disproportionate amount of cognitive resources and significantly increasing its response latency. This is a denial-of-service attack against the 'brain' of the agent, distinct from flooding it with API requests."
          detection_guidance: []
