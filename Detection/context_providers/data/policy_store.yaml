policies:
  - name: "Access Control Standard"
    description: "Security requirements for access management, passwords, authentication, authorization, and access reviews"
    category: "access_control"
    who_affected: "All enterprise personnel that are implementers and resource owners that manage access to corporate non-customer facing environments"
    what_changed: "Added requirements on hardware tokens; added clarification for compliance environments; added reference to Mobile Device Management Standard"
    policy: "This policy establishes comprehensive access control requirements to protect enterprise information systems and data through identity management, authentication, and authorization frameworks. All access must be managed through approved identity and access management (IAM) systems with multi-factor authentication, particularly hardware-backed credentials for high-risk systems. The policy enforces the principle of least privilege, requiring business justification for privileged access, regular access reviews, and proper onboarding/offboarding procedures. Strong authentication requirements include complex passwords/passphrases (minimum 16 characters), account lockouts after failed attempts, and session timeouts. Service accounts and emergency access must be time-limited and logged. MCP requests could violate this policy by attempting to bypass authentication mechanisms, requesting unauthorized access to systems or data, asking for credentials to be shared or logged in plain text, requesting privileged access without proper justification or approval workflows, or attempting to circumvent access logging and monitoring requirements."
    risk_areas: ["authentication", "authorization", "access_management", "password_security"]

  - name: "Anti-malware Standard"
    description: "Anti-malware requirements to implement and sustain anti-malware capabilities in the enterprise IT environment"
    category: "malware_protection"
    who_affected: "All enterprise personnel who need to adhere to mitigation actions, Platform Engineering personnel, Cyber Defense personnel"
    policy: "This policy mandates comprehensive anti-malware protection across all applicable enterprise information resources including desktops, laptops, servers, and containerized workloads. All systems must be configured with approved anti-malware software that automatically updates definitions within 24 hours of release and performs real-time scanning of all files on access or execution. The policy requires centralized logging of all malware events with retention for at least 13 months, near real-time alerting upon malware detection, and immediate mitigation actions such as device quarantine, lock, or re-imaging when threats are identified. Formal approval is required to remove or disable anti-malware software from any system. MCP requests could violate this policy by attempting to disable or bypass anti-malware software, requesting whitelisting of suspicious files or processes, asking to circumvent real-time scanning mechanisms, requesting to disable logging or alerting systems, asking to execute potentially malicious code without proper scanning, or attempting to bypass quarantine or automated mitigation measures."
    risk_areas: ["malware_detection", "threat_response", "endpoint_security"]

  - name: "Change Management Policy"
    description: "Framework for managing changes to enterprise Information Resources"
    category: "change_management"
    who_affected: "All enterprise personnel responsible for establishing and implementing change management standards"
    policy: "This policy establishes a comprehensive framework for managing all changes to enterprise information resources in production and corporate IT environments. All changes must follow established processes based on system criticality and potential impact, requiring proper documentation, ownership assignment, prioritization, independent review, security and functionality testing, and formal approval before implementation. The policy mandates segregation of duties, least privilege access controls, emergency change procedures, and roll-back/roll-forward capabilities for unsuccessful changes. Changes must be logged and monitored throughout the deployment process, with established criteria for success measurement. Emergency changes require immediate corrective action justification and still must follow abbreviated but controlled processes. MCP requests could violate this policy by attempting to make unauthorized changes to systems, bypassing required approval workflows, requesting emergency access without proper business justification, asking to circumvent testing or review requirements, requesting direct production access outside change management processes, or asking to make undocumented or unlogged system modifications."
    risk_areas: ["unauthorized_changes", "system_integrity", "business_disruption"]

  - name: "Cryptography Policy"
    description: "Requirements for the use of cryptography to protect data stored, processed, and transmitted in enterprise information resources"
    category: "cryptography"
    who_affected: "All enterprise personnel or Third-Party providers that process or store enterprise data"
    policy: "This policy mandates the use of approved cryptographic techniques to protect the confidentiality, integrity, and authenticity of enterprise data at rest, in use, and in transit. All Level 1 Personal Data must be encrypted when transmitted over public networks and when stored in third-party or cloud-based platforms. The policy requires implementation of secure cryptographic key lifecycle management including generation, distribution, activation, storage, retrieval, update, recovery, revocation, and destruction processes. Cryptographic techniques must be periodically reviewed to ensure adequate protection levels and remove deprecated methods. All cryptographic systems must be protected against unauthorized access, loss, modification, disclosure, and destruction, with comprehensive logging and monitoring for audit purposes. Key custodians must formally acknowledge their management responsibilities. MCP requests could violate this policy by requesting access to encryption keys or cryptographic materials, asking to decrypt sensitive data without authorization, requesting use of weak or deprecated encryption methods, asking for unencrypted transmission of sensitive data over public networks, requesting to bypass key management processes, asking to disable cryptographic logging or monitoring, or attempting to access cryptographic systems without proper authorization."
    risk_areas: ["data_encryption", "key_management", "cryptographic_compliance"]

  - name: "Cybersecurity Incident Response Plan"
    description: "Processes and responsibilities for detecting, analyzing, containing, eradicating, and recovering from cybersecurity incidents"
    category: "incident_response"
    who_affected: "Cybersecurity Incident Response Team (CIRT), CISO, Incident Response Counsel"
    policy: "This policy establishes a comprehensive cybersecurity incident response framework defining roles, responsibilities, and procedures for detecting, analyzing, containing, eradicating, and recovering from security incidents. The policy requires a dedicated Cybersecurity Incident Response Team (CIRT) with defined escalation procedures, communication protocols, and decision-making authority during incidents. All security incidents must be promptly identified, classified by severity level, and responded to according to established timelines and procedures. The response process includes immediate containment measures, evidence preservation, forensic analysis, threat eradication, system recovery, and post-incident review with lessons learned. The policy mandates real-time monitoring and detection capabilities, automated alerting systems, and integration with threat intelligence sources. Communication procedures include internal notifications to leadership, legal, and business units, as well as external notifications to regulators, law enforcement, customers, and partners as required. All incidents must be thoroughly documented with detailed incident reports, remediation actions, and post-mortem analysis to improve future response capabilities. Business continuity and disaster recovery procedures must be integrated with incident response to minimize operational impact. MCP requests could violate this policy by requesting to bypass or disable security monitoring and alerting systems, asking to suppress or delay incident reporting and notifications, requesting unauthorized access to incident response data or forensic evidence, asking to circumvent established escalation and communication procedures, requesting to disable logging during incident response activities, asking for incident response procedures to be modified without proper authorization, requesting access to sensitive incident data without proper clearance or need-to-know, or asking to interfere with evidence preservation or forensic analysis processes."
    risk_areas: ["incident_detection", "response_coordination", "business_continuity"]

  - name: "Data Classification and Handling Requirements"
    description: "Categorizing data based on sensitivity and defining handling protocols for each category"
    category: "data_protection"
    who_affected: "All enterprise employees and contingent workers who handle enterprise data"
    policy: "This policy establishes a comprehensive data classification framework with multiple sensitivity levels (Public, Internal, Confidential, Highly Restricted) and defines specific handling, storage, transmission, and disposal requirements for each classification level. All enterprise data must be properly classified, labeled, and handled according to its sensitivity level, with access controls, encryption requirements, and retention periods varying by classification. The policy mandates data loss prevention measures, secure transmission protocols for sensitive data, approved storage locations and methods, and proper disposal procedures including secure deletion and destruction. Personnel must receive training on data classification and handling requirements, with regular audits to ensure compliance. Specific protections are required for personal data, financial information, intellectual property, and other regulated data types to meet regulatory compliance requirements including GDPR, HIPAA, PCI DSS, and other applicable frameworks. Data sharing with third parties requires appropriate agreements and controls based on classification levels. MCP requests could violate this policy by requesting access to data above the requestor's authorized classification level, asking for data to be shared without proper agreements or controls, requesting data to be stored in unauthorized locations or formats, asking for sensitive data to be transmitted without encryption, requesting to bypass data labeling or classification requirements, asking for data to be retained beyond approved periods or disposed of improperly, or requesting to access or process regulated data without proper authorization or compliance controls."
    risk_areas: ["data_breaches", "unauthorized_access", "regulatory_compliance"]

  - name: "Network Security Policy"
    description: "Requirements for protecting enterprise network and connected information resources"
    category: "network_security"
    who_affected: "All enterprise personnel, Engineering Security staff, Platform Engineering staff"
    policy: "This policy establishes comprehensive network security requirements to protect enterprise networks and connected information resources across production, corporate, and cloud environments. The policy mandates maintaining logical network architecture diagrams, implementing network security controls for different network types (wireless, LAN, VPN, cloud security groups), and restricting and monitoring network traffic at key network boundaries. Requirements include periodic reviews of access control lists (ACLs), network-based intrusion detection and prevention systems at public perimeter boundaries, denial of service (DoS) attack protections, and secure configuration enforcement. Network access controls must follow the principle of least privilege, with managed remote access requiring multi-factor authentication and proactive monitoring of third-party remote access accounts. The policy requires identification and remediation of unauthorized network access points. MCP requests could violate this policy by attempting to bypass network security controls or firewalls, requesting unauthorized network access or connectivity, asking to disable network monitoring or intrusion detection systems, requesting modifications to firewall rules or ACLs without proper authorization, attempting to circumvent multi-factor authentication for remote access, asking to create unauthorized network connections or access points, or requesting to disable perimeter protections or security logging."
    risk_areas: ["network_intrusion", "unauthorized_access", "data_interception"]

  - name: "Secrets Management Policy"
    description: "Secure handling of digital authentication credentials including passwords, API keys, encryption keys, and tokens"
    category: "secrets_management"
    who_affected: "All enterprise personnel, including full-time and part-time employees, interns, contractors, and vendors"
    policy: "This policy establishes comprehensive requirements for managing digital authentication credentials (secrets) including privileged account credentials, API keys, SSH keys, encryption keys, passwords, certificates, and tokens. All secrets must be managed through authorized secrets management systems with restricted administrative access, comprehensive logging of all CRUD operations, and encryption at rest and in transit. Secrets must be generated programmatically with sufficient randomness and keyspace, never stored in plain text, source code, or logged in non-redacted form. Production secrets cannot be used in development or test environments and must not be over-shared between services. Secret sharing with third parties requires authorization and must use approved systems. The policy mandates regular secret rotation, immediate rotation of compromised secrets, periodic review and deletion of unused secrets, and proper cleanup when systems are retired. Access controls must restrict secret operations to authorized users only, with no individual ownership of production secrets. Regular scanning of source code and repositories for exposed secrets is required, with immediate security reporting of any compromise. MCP requests could violate this policy by requesting access to secrets or credentials without authorization, asking for secrets to be stored in plain text or logged, requesting secrets to be shared inappropriately with third parties, asking to bypass authorized secrets management systems, requesting to disable logging or auditing mechanisms, asking for production secrets to be used in development environments, requesting to avoid or delay secret rotation requirements, or asking to access secrets management systems without proper administrative authorization."
    risk_areas: ["credential_theft", "unauthorized_access", "privilege_escalation"]

  - name: "Vulnerability and Patch Management Policy"
    description: "Requirements for managing security vulnerabilities and patches of enterprise information resources"
    category: "vulnerability_management"
    who_affected: "Enterprise personnel in Engineering and Security responsible for managing vulnerabilities and patches"
    policy: "This policy establishes comprehensive requirements for managing security vulnerabilities and patches across all enterprise information resources in production, corporate, and cloud environments. The policy mandates vulnerability management standards that define applicable systems, vendor notification mechanisms, vulnerability scanning processes for both external and internal assets, severity ratings, response timelines, and remediation monitoring. Regular external and internal vulnerability scans and penetration tests must be performed using authorized tools with defined frequencies based on system criticality, including validation scans after remediation and approved scanning vendor validation for compliance environments. Penetration testing must follow established methodologies covering critical environments with application and network layer testing from inside and outside networks, including segmentation validation. Software patch management standards must define applicable systems, patch notification mechanisms, severity ratings, response timelines, and implementation monitoring. Vulnerability remediation and patch implementation must follow established SLA timelines and change management processes. The policy requires segregation of duties between assessment/testing personnel and remediation teams, with independent revalidation processes for remediation verification. MCP requests could violate this policy by requesting to bypass or disable vulnerability scanning systems, asking to delay or skip critical security patches, requesting unauthorized access to vulnerability assessment data or penetration test results, asking to circumvent established remediation timelines or SLAs, requesting to disable monitoring of patch implementation activities, asking to bypass change management processes for security patches, or requesting to combine assessment and remediation responsibilities in violation of segregation of duties requirements."
    risk_areas: ["unpatched_vulnerabilities", "system_exploitation", "security_gaps"]

  - name: "Data Authenticity and Integrity Standard"
    description: "Requirements for ensuring data accuracy, authenticity, and prevention of data poisoning in AI/ML systems"
    category: "data_integrity"
    who_affected: "All AI agents, data analytics tools, and automated decision systems"
    policy: "This policy mandates verification of data authenticity and integrity for all automated decision-making systems. Tools must not systematically provide fabricated, manipulated, or misleading data that claims to represent real-world information. Financial tools must return prices within realistic market ranges. Credential management tools must not return hardcoded test credentials when claiming to access real systems. Tools that claim to access external APIs must demonstrate actual API connectivity in source code. Data presented as 'real-time' must have current timestamps. Tools generating synthetic data for legitimate purposes (reports, dashboards, summaries) are acceptable when the purpose clearly indicates data generation or aggregation."
    risk_areas: ["data_poisoning", "semantic_manipulation", "decision_integrity"]

  - name: "Tool Permission Boundaries and Access Control"
    description: "Requirements for controlling tool permissions and preventing excessive access to sensitive resources"
    category: "tool_permissions"
    who_affected: "All MCP servers, tools, and agent systems with resource access capabilities"
    policy: "This policy establishes strict boundaries for tool permissions and access patterns. Tools must operate under the principle of least privilege, accessing only resources necessary for their stated functionality. Tools must not access private repositories, credential stores, authentication databases, or user permission systems unless explicitly authorized for security operations. Access patterns to sensitive resources matter regardless of whether data is production or test/mock data. Tools must respect scope boundaries and not perform actions unrelated to their stated business purpose. Metadata-only tools must not read full file contents. Read-only tools must not have write capabilities."
    risk_areas: ["privilege_escalation", "unauthorized_access", "credential_exposure", "scope_violation"]

  - name: "Prompt Integrity and Control Flow Protection"
    description: "Requirements for maintaining prompt integrity and preventing control flow manipulation"
    category: "prompt_security"
    who_affected: "All AI agents and systems processing user prompts and tool outputs"
    policy: "This policy protects against prompt manipulation and control flow hijacking. User-stated goals must align with actual tool execution patterns. Tools must not inject hidden instructions into their outputs. Tool call sequences must logically support the user's stated business purpose. Agents must not be redirected to perform actions unrelated to the original user request. Multi-step workflows must maintain coherent goal alignment throughout execution."
    risk_areas: ["prompt_injection", "control_flow_hijacking", "goal_misalignment"]
